name: rice_yield_app
description: စပါးစံကွက်ရိတ်သိမ်းရေးစနစ် (တည်မြဲအမိန့် ၁၉၀)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2   # ဒေတာသိမ်းဆည်းရန်
  pdf: ^3.10.8                 # PDF ဖန်တီးရန်
  printing: ^5.11.1            # PDF ပရင့်/မျှဝေရန်
  intl: ^0.19.0                # ရက်စွဲ format ရန်

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
